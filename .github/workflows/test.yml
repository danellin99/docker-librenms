name: Docker-LibreNMS CI Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create empty directories for volumes
        run: |
          mkdir -p mysql data influxdb grafana
          chmod -R 777 mysql data influxdb grafana

      - name: Validate Docker Compose
        run: docker compose config

      - name: Start containers
        run: docker compose up -d

      - name: Check container status
        run: docker ps -a

      - name: Wait for LibreNMS to be ready
        run: |
          # 等待最多 2 分鐘，使用 HTTP 狀態碼判斷 (200 或 302 均視為成功)
          for i in {1..24}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost)
            if [[ "$HTTP_CODE" == "200" || "$HTTP_CODE" == "302" ]]; then
              echo "LibreNMS is UP! (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "Waiting for LibreNMS... (Current: HTTP $HTTP_CODE) ($i)"
            sleep 5
          done
          echo "LibreNMS failed to respond with 200/302 in time"
          docker compose logs librenms
          exit 1

      - name: Cleanup
        if: always()
        run: docker compose down
